<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fat Patties | Scan Your Shirt</title>

<!-- MindAR image tracking (no Arloopa, no third-party app) -->
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-master.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  :root {
    --primary: #e63946;
    --dark: #121212;
    --accent: #ffb703;
    --gold: #e0a63a;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--dark);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #overlay {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 10;
    text-align: center;
    padding: 18px 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0));
    color: white;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #overlay h1 {
    margin: 0;
    font-size: 1.1rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--primary);
  }
  #overlay p {
    margin: 4px 0 0 0;
    font-size: 0.85rem;
    color: #ccc;
  }
  #status {
    position: fixed;
    bottom: 130px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: rgba(0,0,0,0.85);
    color: var(--accent);
    padding: 12px 22px;
    border-radius: 30px;
    font-weight: bold;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  #status.show { opacity: 1; }

  /* ===== Tap-the-truck start screen (2D, quick entry point) ===== */
  #startScreen {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: var(--dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #startScreen .startTruck {
    width: min(70vw, 260px);
    animation: pulse 1.8s ease-in-out infinite;
  }
  #startScreen svg { width: 100%; display: block; }
  #startScreen .startLabel {
    margin-top: 22px;
    font-size: 12px;
    letter-spacing: 0.18em;
    font-weight: 700;
    color: var(--gold);
  }
  #startScreen .startSub {
    margin-top: 6px;
    font-size: 11px;
    color: #888;
  }

  /* ===== Truck dock — reserved corner spot, hints the real 3D truck is coming ===== */
  #truckDock {
    position: fixed;
    top: 78px; right: 14px;
    z-index: 11;
    width: 54px; height: 54px;
    border-radius: 12px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(224,166,58,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    animation: dockPulse 2.2s ease-in-out infinite;
    transition: opacity 0.3s ease;
  }
  #truckDock svg { width: 100%; display: block; }
  @keyframes dockPulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  /* ===== Ad rail — up to 4 slots, visible the whole time someone's scanning ===== */
  #adRail {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 11;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px 20px;
    background: linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0.6) 70%, transparent);
    transition: opacity 0.3s ease;
  }
  .ad-card {
    flex: 1 1 0;
    min-width: 0;
    border-radius: 10px;
    overflow: hidden;
    background: #1a1a1a;
    border: 1px solid rgba(255,255,255,0.14);
    text-decoration: none;
    color: white;
  }
  .ad-card .ad-media {
    width: 100%;
    height: 92px;
    background-size: cover;
    background-position: center;
    background-color: #232323;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ad-card .ad-media video { width: 100%; height: 100%; object-fit: cover; }
  .ad-card .ad-empty-icon {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #777;
    text-align: center;
    padding: 6px;
    line-height: 1.5;
  }
  .ad-card .ad-label {
    font-size: 11px;
    font-weight: 700;
    padding: 7px 8px 8px;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }

  /* ===== "Tap the truck" hint, shown once the 3D truck appears ===== */
  #tapHint {
    position: fixed;
    bottom: 150px; left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    font-size: 12px;
    letter-spacing: 0.18em;
    font-weight: 700;
    color: var(--gold);
    background: rgba(0,0,0,0.6);
    padding: 8px 18px;
    border-radius: 20px;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  #tapHint.show { opacity: 1; animation: pulse 1.6s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }
  #tapHint.show { transform: translateX(-50%) scale(1); }

  /* ===== Scan frame — corner brackets + moving scan line while hunting for the logo ===== */
  #scanFrame {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(68vw, 280px);
    height: min(68vw, 280px);
    z-index: 9;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #scanFrame.show { opacity: 1; }
  #scanFrame .corner {
    position: absolute;
    width: 34px; height: 34px;
    border: 3px solid var(--gold);
    filter: drop-shadow(0 0 3px rgba(224,166,58,0.5));
  }
  #scanFrame .corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 6px; }
  #scanFrame .corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; border-top-right-radius: 6px; }
  #scanFrame .corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; border-bottom-left-radius: 6px; }
  #scanFrame .corner.br { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 6px; }
  #scanFrame .scanLine {
    position: absolute;
    left: 6px; right: 6px;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    box-shadow: 0 0 8px 1px rgba(224,166,58,0.7);
    animation: scanMove 2.1s ease-in-out infinite;
  }
  #scanFrame .scanLabel {
    position: absolute;
    bottom: -30px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.14em;
    font-weight: 700;
    color: var(--gold);
    white-space: nowrap;
    opacity: 0.85;
  }
  #scanFrame .scanTarget {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
    padding: 8px 14px;
    background: rgba(0,0,0,0.35);
    border-radius: 8px;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  #scanFrame .scanTarget.show { opacity: 1; }
  @keyframes scanMove {
    0%   { top: 6%; }
    50%  { top: 92%; }
    100% { top: 6%; }
  }

  @media (prefers-reduced-motion: reduce) {
    #startScreen .startTruck, #truckDock, #tapHint.show, #scanFrame .scanLine { animation: none; }
  }
</style>
</head>
<body>

  <div id="overlay">
    <h1>Point Your Camera at the Shirt</h1>
    <p>Fat Patties &bull; Fat Tech &bull; SpinPay &bull; Jumbo Jive Turkey</p>
  </div>

  <!-- Reserved dock icon — hints the real 3D truck, small so it doesn't block scanning -->
  <div id="truckDock" title="Fat Patties truck">
    <svg viewBox="0 0 220 110" fill="none" stroke="#e0a63a" stroke-width="4">
      <rect x="14" y="30" width="120" height="52" rx="3"/>
      <path d="M134 46h34l24 20v16h-58z"/>
      <circle cx="52" cy="90" r="12" fill="#121212"/>
      <circle cx="176" cy="90" r="12" fill="#121212"/>
    </svg>
  </div>

  <div id="status"></div>
  <div id="tapHint">TAP THE TRUCK</div>

  <!-- Scan frame: shown while camera is hunting for a shirt logo -->
  <div id="scanFrame">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="scanLine"></div>
    <div class="scanTarget" id="scanTarget"></div>
    <div class="scanLabel">SCANNING&hellip;</div>
  </div>

  <!-- Start screen: tap the truck to turn on the camera -->
  <div id="startScreen">
    <div class="startTruck">
      <svg viewBox="0 0 220 110" fill="none" stroke="#e0a63a" stroke-width="2.5">
        <rect x="14" y="30" width="120" height="52" rx="3"/>
        <path d="M134 46h34l24 20v16h-58z"/>
        <circle cx="52" cy="90" r="12" fill="#121212"/>
        <circle cx="176" cy="90" r="12" fill="#121212"/>
        <text x="72" y="60" fill="#e0a63a" stroke="none" font-family="Arial, sans-serif" font-weight="bold" font-size="15" text-anchor="middle">FAT</text>
        <text x="72" y="74" fill="#e0a63a" stroke="none" font-family="Arial, sans-serif" font-weight="bold" font-size="15" text-anchor="middle">PATTIES</text>
      </svg>
    </div>
    <div class="startLabel">TAP THE TRUCK TO START</div>
    <div class="startSub">turns on your camera to scan the shirt</div>
  </div>

  <!-- Ad rail: up to 4 slots, image or video, filled from CONFIG.scanAds below -->
  <div id="adRail"></div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiScanning: no; uiLoading: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="width:100%;height:100%;"
  >
    <a-assets>
      <a-mixin id="glossy"
        material="roughness: 0.32; metalness: 0.35; envMapIntensity: 1"></a-mixin>
    </a-assets>

    <!-- Soft studio-style lighting so the truck reads as smooth/glossy, not flat -->
    <a-entity light="type: ambient; color: #fff5e6; intensity: 0.65"></a-entity>
    <a-entity light="type: directional; color: #fff2d9; intensity: 0.9" position="1.5 2 1"></a-entity>
    <a-entity light="type: point; color: #ffd9a0; intensity: 0.4" position="-1 0.5 1.2"></a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="objects: .clickable">

      <!-- ============= REAL 3D TRUCK (HUD-attached, hidden until a logo is found) ============= -->
      <a-entity id="truck3D" visible="false" position="0 -0.18 -0.85" scale="0.001 0.001 0.001">

        <a-entity id="truckSpin" rotation="0 -25 0" animation="property: rotation; to: 0 335 0; dur: 7000; loop: true; easing: linear">

          <!-- cargo box -->
          <a-box class="clickable" width="1.15" height="0.62" depth="0.58"
            position="-0.05 0.32 0" color="#e0a63a" mixin="glossy" rounded></a-box>

          <!-- cargo box front cap (rounds off the sharp front edge visually) -->
          <a-cylinder class="clickable" radius="0.31" height="0.58" rotation="0 0 90"
            position="0.52 0.32 0" color="#e0a63a" mixin="glossy" segments-radial="16"></a-cylinder>

          <!-- red roof overhang -->
          <a-box class="clickable" width="1.3" height="0.08" depth="0.66"
            position="-0.05 0.66 0" color="#c1392b" mixin="glossy"></a-box>

          <!-- cab -->
          <a-box class="clickable" width="0.5" height="0.44" depth="0.6"
            position="0.62 0.2 0" color="#c1392b" mixin="glossy"></a-box>

          <!-- windshield -->
          <a-box class="clickable" width="0.06" height="0.28" depth="0.52"
            position="0.85 0.3 0" color="#1a1a1a" material="roughness: 0.1; metalness: 0.6; opacity: 0.85; transparent: true"></a-box>

          <!-- front bumper -->
          <a-box class="clickable" width="0.06" height="0.1" depth="0.5"
            position="0.95 0.02 0" color="#2a2a2a" mixin="glossy"></a-box>

          <!-- headlights -->
          <a-sphere class="clickable" radius="0.045" position="0.93 0.08 0.22" color="#ffe9a8" material="emissive: #ffcf6b; emissiveIntensity: 0.6; roughness: 0.2"></a-sphere>
          <a-sphere class="clickable" radius="0.045" position="0.93 0.08 -0.22" color="#ffe9a8" material="emissive: #ffcf6b; emissiveIntensity: 0.6; roughness: 0.2"></a-sphere>

          <!-- wheels -->
          <a-cylinder class="clickable" radius="0.16" height="0.1" rotation="0 0 90" position="0.55 -0.1 0.34" color="#191919" mixin="glossy" segments-radial="20"></a-cylinder>
          <a-cylinder class="clickable" radius="0.16" height="0.1" rotation="0 0 90" position="0.55 -0.1 -0.34" color="#191919" mixin="glossy" segments-radial="20"></a-cylinder>
          <a-cylinder class="clickable" radius="0.16" height="0.1" rotation="0 0 90" position="-0.35 -0.1 0.34" color="#191919" mixin="glossy" segments-radial="20"></a-cylinder>
          <a-cylinder class="clickable" radius="0.16" height="0.1" rotation="0 0 90" position="-0.35 -0.1 -0.34" color="#191919" mixin="glossy" segments-radial="20"></a-cylinder>

          <!-- hubcaps -->
          <a-cylinder radius="0.06" height="0.102" rotation="0 0 90" position="0.55 -0.1 0.34" color="#e0a63a" mixin="glossy" segments-radial="12"></a-cylinder>
          <a-cylinder radius="0.06" height="0.102" rotation="0 0 90" position="0.55 -0.1 -0.34" color="#e0a63a" mixin="glossy" segments-radial="12"></a-cylinder>
          <a-cylinder radius="0.06" height="0.102" rotation="0 0 90" position="-0.35 -0.1 0.34" color="#e0a63a" mixin="glossy" segments-radial="12"></a-cylinder>
          <a-cylinder radius="0.06" height="0.102" rotation="0 0 90" position="-0.35 -0.1 -0.34" color="#e0a63a" mixin="glossy" segments-radial="12"></a-cylinder>

          <!-- side branding -->
          <a-text value="FAT PATTIES" align="center" color="#2a1a08" width="1.4"
            position="-0.05 0.32 0.295" rotation="0 0 0"></a-text>
          <a-text value="FAT PATTIES" align="center" color="#2a1a08" width="1.4"
            position="-0.05 0.32 -0.295" rotation="0 180 0"></a-text>

        </a-entity>
      </a-entity>

    </a-camera>

    <!-- 0: Fat Patties -->
    <a-entity mindar-image-target="targetIndex: 0"></a-entity>
    <!-- 1: Fat Tech -->
    <a-entity mindar-image-target="targetIndex: 1"></a-entity>
    <!-- 2: SpinPay -->
    <a-entity mindar-image-target="targetIndex: 2"></a-entity>
    <!-- 3: Jumbo Jive Turkey -->
    <a-entity mindar-image-target="targetIndex: 3"></a-entity>
  </a-scene>

    // =======================

    const startScreen = document.getElementById('startScreen');
    const statusEl     = document.getElementById('status');
    const overlayEl     = document.getElementById('overlay');
    const sceneEl      = document.getElementById('arScene');
    const adRail       = document.getElementById('adRail');
    const truckDock    = document.getElementById('truckDock');
    const tapHint      = document.getElementById('tapHint');
    const truck3D      = document.getElementById('truck3D');
    const truckSpin    = document.getElementById('truckSpin');
    const scanFrame    = document.getElementById('scanFrame');
    const scanTarget    = document.getElementById('scanTarget');
    let scanCycleTimer = null;
    let scanCycleIndex = 0;
    let redirected = false;
    let truckShown = false;

    // ---- Build the ad rail ----
    function buildAdRail() {
      adRail.innerHTML = '';
      CONFIG.scanAds.slice(0, 4).forEach((ad) => {
        const card = document.createElement(ad ? 'a' : 'div');
        card.className = 'ad-card';
        if (ad) {
          card.href = ad.link || '#';
          card.target = '_blank';
          card.rel = 'noopener';
          const mediaHtml = ad.type === 'video'
            ? `<video src="${ad.media}" autoplay muted loop playsinline></video>`
            : '';
          const mediaStyle = ad.type === 'video' ? '' : `style="background-image:url('${ad.media}')"`;
          card.innerHTML = `<div class="ad-media" ${mediaStyle}>${mediaHtml}</div><div class="ad-label">${ad.name}</div>`;
        } else {
          card.innerHTML = `<div class="ad-media"><div class="ad-empty-icon">AD<br>SPACE<br>OPEN</div></div><div class="ad-label" style="color:#777;">Available</div>`;
        }
        adRail.appendChild(card);
      });
    }
    buildAdRail();

    function showStatus(text) {
      statusEl.textContent = text;
      statusEl.classList.add('show');
    }

    // Cycle through the 4 possible logos in the center of the scan frame,
    // so people know what they're hunting for while the camera searches.
    function startScanCycle() {
      scanCycleIndex = 0;
      scanTarget.textContent = CONFIG.targetNames[0];
      scanTarget.classList.add('show');
      scanCycleTimer = setInterval(() => {
        scanTarget.classList.remove('show');
        setTimeout(() => {
          scanCycleIndex = (scanCycleIndex + 1) % CONFIG.targetNames.length;
          scanTarget.textContent = CONFIG.targetNames[scanCycleIndex];
          scanTarget.classList.add('show');
        }, 300);
      }, 1800);
    }
    function stopScanCycle() {
      if (scanCycleTimer) clearInterval(scanCycleTimer);
      scanCycleTimer = null;
      scanTarget.classList.remove('show');
    }

    // Logo recognized -> reveal the real 3D truck, pop it into view
    function handleFound(name) {
      if (redirected || truckShown) return;
      truckShown = true;
      showStatus(name + " found!");
      overlayEl.style.opacity = '0';
      truckDock.style.opacity = '0';
      adRail.style.opacity = '0';
      scanFrame.classList.remove('show');
      stopScanCycle();

      truck3D.setAttribute('visible', 'true');
      truck3D.setAttribute('animation__pop',
        'property: scale; from: 0.001 0.001 0.001; to: 1 1 1; dur: 500; easing: easeOutBack');
      tapHint.classList.add('show');
    }

    // Tap the truck -> spin down, drive off in 3D, then redirect
    function driveOff() {
      if (redirected || !truckShown) return;
      redirected = true;
      tapHint.classList.remove('show');
      truckSpin.removeAttribute('animation');
      truck3D.setAttribute('animation__drive',
        'property: position; to: 4 -0.05 -0.85; dur: 750; easing: easeInQuad');
      truck3D.setAttribute('animation__fade',
        'property: scale; to: 0.7 0.7 0.7; dur: 750; easing: easeInQuad');
      setTimeout(() => {
        window.location.href = CONFIG.destination;
      }, 780);
    }

    truck3D.addEventListener('click', driveOff);

    startScreen.addEventListener('click', () => {
      startScreen.style.display = 'none';
      sceneEl.systems["mindar-image-system"].start();
      scanFrame.classList.add('show');
      startScanCycle();
    });

    document.querySelectorAll('[mindar-image-target]').forEach((el, i) => {
      el.addEventListener('targetFound', () => {
        handleFound(CONFIG.targetNames[i] || ("Target " + i));
      });
    });
  </script>

</body>
</html>
