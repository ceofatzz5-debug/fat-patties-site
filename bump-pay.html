<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bump Pay — Fat Patties</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --panel2: #1c1c1c;
    --gold: #e0a63a;
    --gold-dim: #9c7527;
    --bone: #ece5d8;
    --line: #2a2a2a;
    --red: #c0392b;
    --green: #3fae5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--bone);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  h1, h2, h3 { font-family: 'Anton', Impact, sans-serif; letter-spacing: 0.5px; }
  #root { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 12px;
    margin-bottom: 20px;
  }
  .header h1 { color: var(--gold); font-size: 28px; margin: 0; text-transform: uppercase; }
  .header .sub { color: #888; font-size: 12px; }

  .sync-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .btn {
    background: var(--panel2);
    color: var(--bone);
    border: 1px solid var(--line);
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn:hover { border-color: var(--gold-dim); }
  .btn.primary {
    background: var(--gold);
    color: #111;
    border: none;
  }
  .btn.primary:hover { background: #f0b64a; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .sync-status {
    font-size: 13px;
    color: #999;
  }
  .sync-status.ok { color: var(--green); }
  .sync-status.err { color: #e07a5f; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    padding: 10px 18px;
    cursor: pointer;
    color: #888;
    font-weight: 600;
    font-size: 14px;
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h3 { margin: 0 0 10px; color: var(--gold); font-size: 16px; text-transform: uppercase; }

  .add-form {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .add-form input, .add-form select {
    background: var(--panel2);
    border: 1px solid var(--line);
    color: var(--bone);
    padding: 8px 10px;
    border-radius: 5px;
    font-size: 14px;
  }
  .add-form input[type=text] { flex: 1; min-width: 120px; }
  .add-form input[type=number]
