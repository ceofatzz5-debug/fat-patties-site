# Fat Patties Eats (ordering site). Publishes the eats/ folder and runs functions in netlify/functions.
[build]
  publish = "eats"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Short links: fatpattieseats.netlify.app/staff and /driver
[[redirects]]
  from = "/staff"
  to = "/staff.html"
  status = 200

[[redirects]]
  from = "/driver"
  to = "/driver.html"
  status = 200
